  <rect x="176" y="362" width="160" height="70" fill="none" stroke="#26382D" stroke-width="6" />
  
  <!-- Central Emblem: Monogram B in Brand Green -->
  <path d="M 220 180 L 270 180 C 295 180 310 195 310 215 C 310 230 300 242 285 248 C 305 254 316 268 316 290 C 316 315 295 332 268 332 L 220 332 Z M 250 206 L 250 240 L 268 240 C 280 240 286 232 286 223 C 286 213 278 206 266 206 Z M 250 264 L 250 306 L 270 306 C 284 306 292 298 292 285 C 292 272 283 264 268 264 Z" fill="#4FB286" />
</svg>
