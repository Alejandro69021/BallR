<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="50%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Maskable Safe Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Shield Crest Outer Border -->
  <path
    d="M 256 48 L 416 112 C 416 280 344 392 256 448 C 168 392 96 280 96 112 Z"
    fill="#090D16"
    stroke="url(#voltGrad)"
    stroke-width="14"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Inner Athletic Geometric Pattern -->
  <path
    d="M 256 76 L 390 130 C 390 270 330 365 256 414 C 182 365 122 270 122 130 Z"
    fill="#0F172A"
    opacity="0.85"
    stroke="#1E293B"
    stroke-width="4"
  />

  <!-- Lightning Bolt Action Glyph -->
  <polygon
    points="280,120 180,270 248,270 216,390 340,230 270,230"
    fill="url(#voltGrad)"
    filter="url(#neonGlow)"
  />

  <!-- Football Telemetry Orb Grid -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="12 16" opacity="0.6" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#84CC16" stroke-width="2" stroke-dasharray="6 24" opacity="0.4" />

  <!-- Monogram Brand Bar -->
  <g transform="translate(256, 435)">
    <rect x="-90" y="-18" width="180" height="32" rx="16" fill="#000000" stroke="#84CC16" stroke-width="3" />
    <text x="0" y="5" font-family="'Chakra Petch', sans-serif, system-ui" font-weight="900" font-size="18" fill="#CCFF00" text-anchor="middle" letter-spacing="2">
      PROSPEKBOLA
    </text>
  </g>
</svg>

