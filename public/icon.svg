<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark Workspace Canvas -->
  <rect width="512" height="512" rx="100" fill="#0B0F14" />
  
  <!-- Outer Surface Panel -->
  <rect x="40" y="40" width="432" height="432" rx="72" fill="#11161D" stroke="#2C3643" stroke-width="4" />
  
  <!-- Pitch Lines Graphic in Brand Pitch Green -->
  <rect x="80" y="80" width="352" height="352" rx="24" fill="none" stroke="#26382D" stroke-width="6" />
  <!-- Halfway line -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#26382D" stroke-width="6" />
  <!-- Center circle -->
  <circle cx="256" cy="256" r="64" fill="none" stroke="#26382D" stroke-width="6" />
  <circle cx="256" cy="256" r="6" fill="#4FB286" />
  
  <!-- Penalty Boxes -->
